# ==================================================
# Terminal capabilities
# ==================================================

# Programs running inside tmux should see tmux-256color.
set-option -g default-terminal "tmux-256color"

# Ghostty reports itself as xterm-ghostty.
#
# RGB:
#   Enables 24-bit true color.
#
# sync:
#   Enables synchronized terminal updates and may reduce
#   visible intermediate redraw frames in Neovim.
set-option -as terminal-features ",xterm-ghostty:RGB:sync"

# Do not copy the outer terminal's TERM value into tmux sessions.
# tmux must set TERM=tmux-256color for programs running inside it.
set-option -ga update-environment TERM_PROGRAM

# Passthrough is unnecessary for normal Neovim rendering.
# Enable it only when using features that explicitly require it,
# such as certain terminal image protocols.
set-option -g allow-passthrough off

# Reduce the delay after pressing Escape.
set-option -sg escape-time 10

# Improve key handling in modern terminal applications.
set-option -g focus-events on

# ==================================================
# Prefix
# ==================================================

set-option -g prefix C-a

unbind-key C-b
bind-key C-a send-prefix

# ==================================================
# Pane creation
# ==================================================

unbind-key %

bind-key | split-window -h -c "#{pane_current_path}"

unbind-key '"'

bind-key - split-window -v -p 20 -c "#{pane_current_path}"

# ==================================================
# Reload configuration
# ==================================================

unbind-key r

bind-key r source-file ~/.config/tmux/tmux.conf \; \
    display-message "tmux configuration reloaded"

# ==================================================
# Pane resizing
# ==================================================

bind-key -r h resize-pane -L 5
bind-key -r j resize-pane -D 5
bind-key -r k resize-pane -U 5
bind-key -r l resize-pane -R 5

# Toggle pane zoom.
bind-key -r m resize-pane -Z

# ==================================================
# Mouse and copy mode
# ==================================================

set-option -g mouse on
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Keep copy mode active while dragging with the mouse.
unbind-key -T copy-mode-vi MouseDragEnd1Pane

# Allow tmux to synchronize copied text with the terminal clipboard
# through OSC 52 when supported.
set-option -g set-clipboard on

# ==================================================
# Window and pane numbering
# ==================================================

set-option -g base-index 1
set-option -g pane-base-index 1
set-window-option -g pane-base-index 1

set-option -g renumber-windows on

# ==================================================
# Neovim dark theme palette
# ==================================================

# Neovim palette:
#
# bg         #181513
# bg_dark    #12100f
# bg_float   #201c19
# bg_visual  #372b23
#
# fg         #d4c5b4
# fg_dim     #8f8176
# fg_dark    #5b4a47
#
# red        #c46c62
# orange     #d08b5b
# yellow     #c8a96b
# green      #84966b
# cyan       #779b91
# blue       #728ca3
# purple     #9a7e9c
#
# border     #493d36

# ==================================================
# Pane borders
# ==================================================

set-option -g pane-border-style \
    "fg=#493d36,bg=default"

set-option -g pane-active-border-style \
    "fg=#d08b5b,bg=default"

# ==================================================
# Messages and copy mode
# ==================================================

set-option -g mode-style \
    "fg=#181513,bg=#d08b5b,bold"

set-option -g message-style \
    "fg=#d4c5b4,bg=#201c19"

set-option -g message-command-style \
    "fg=#d08b5b,bg=#201c19,bold"

# ==================================================
# Status bar
# ==================================================

set-option -g status on
set-option -g status-position bottom
set-option -g status-justify left
set-option -g status-interval 5

set-option -g status-style \
    "fg=#8f8176,bg=#12100f"

set-option -g status-left-length 100
set-option -g status-right-length 100

set-option -g status-left-style NONE
set-option -g status-right-style NONE

# Session block.
set-option -g status-left \
"#[fg=#181513,bg=#d08b5b,bold] #S \
#[fg=#d08b5b,bg=#12100f,nobold,nounderscore,noitalics]"

# Right-side information:
# prefix state, date, time, and hostname.
set-option -g status-right \
"#[fg=#12100f,bg=#12100f,nobold,nounderscore,noitalics]\
#[fg=#d08b5b,bg=#12100f]#{prefix_highlight} \
#[fg=#493d36,bg=#12100f,nobold,nounderscore,noitalics]\
#[fg=#d4c5b4,bg=#493d36] %Y-%m-%d  %H:%M \
#[fg=#493d36,bg=#493d36,nobold,nounderscore,noitalics]\
#[fg=#181513,bg=#d08b5b,bold] #h "

# ==================================================
# Window status
# ==================================================

set-window-option -g window-status-separator ""

set-window-option -g window-status-style \
    "fg=#8f8176,bg=#12100f"

set-window-option -g window-status-activity-style \
    "fg=#c8a96b,bg=#12100f,underscore"

set-window-option -g window-status-bell-style \
    "fg=#c46c62,bg=#12100f,bold"

set-window-option -g window-status-format \
"#[fg=#12100f,bg=#12100f,nobold,nounderscore,noitalics]\
#[fg=#8f8176,bg=#12100f] #I  #W #F \
#[fg=#12100f,bg=#12100f,nobold,nounderscore,noitalics]"

set-window-option -g window-status-current-format \
"#[fg=#12100f,bg=#372b23,nobold,nounderscore,noitalics]\
#[fg=#d08b5b,bg=#372b23,bold] #I  #W #F \
#[fg=#372b23,bg=#12100f,nobold,nounderscore,noitalics]"

# ==================================================
# Prefix highlight
# ==================================================

set-option -g @prefix_highlight_output_prefix \
    "#[fg=#12100f,bg=#12100f]#[fg=#181513,bg=#c8a96b,bold]"

set-option -g @prefix_highlight_output_suffix \
    "#[fg=#c8a96b,bg=#12100f]"

set-option -g @prefix_highlight_show_copy_mode on
set-option -g @prefix_highlight_copy_mode_attr \
    "fg=#181513,bg=#779b91,bold"

set-option -g @prefix_highlight_show_sync_mode on
set-option -g @prefix_highlight_sync_mode_attr \
    "fg=#181513,bg=#9a7e9c,bold"

# ==================================================
# Plugins
# ==================================================

set-option -g @plugin "tmux-plugins/tpm"
set-option -g @plugin "tmux-plugins/tmux-sensible"
set-option -g @plugin "christoomey/vim-tmux-navigator"

# Required because #{prefix_highlight} is used in status-right.
set-option -g @plugin "tmux-plugins/tmux-prefix-highlight"

# TPM must remain at the bottom.
run-shell "~/.tmux/plugins/tpm/tpm"
